name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r gateway/requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "PubSubClient" "ArduinoJson" "Adafruit SHT4x Library" "Adafruit SHT31 Library" "IRremoteESP8266@2.9.0"
      - name: Compile (ESP32-S3)
        run: |
          cp firmware/room_node/config.example.h firmware/room_node/config.h
          arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/room_node
          arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/tools/ir_loopback
          arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/tools/sensor_check
          arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/tools/ir_replay

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # dinh kem APK vao release khi day tag v*
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pbl5-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "pbl5-smartac-${GITHUB_REF_NAME}.apk"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Xem CHANGELOG.md" --draft
          gh release upload "$GITHUB_REF_NAME" "pbl5-smartac-${GITHUB_REF_NAME}.apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
