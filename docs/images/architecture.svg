  <rect x="115" y="536" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="1.3"/>
  <text x="220" y="557" text-anchor="middle" font-size="11.5" fill="#1F2937">Cảm biến hiện diện</text>
  <line x1="220" y1="570" x2="220" y2="582" stroke="#6B7280" stroke-width="1.3"/>
