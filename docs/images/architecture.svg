  <rect x="675" y="582" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#F97066" stroke-width="1.3"/>
  <text x="780" y="603" text-anchor="middle" font-size="11.5" fill="#1F2937">IR Driver</text>

  <!-- ============ ROOM NODE -> AC (IR) ============ -->
  <line x1="220" y1="630" x2="220" y2="668" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="228" y="653" font-size="11" fill="#374151">IR</text>
  <line x1="500" y1="630" x2="500" y2="668" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="508" y="653" font-size="11" fill="#374151">IR</text>
  <line x1="780" y1="630" x2="780" y2="668" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="788" y="653" font-size="11" fill="#374151">IR</text>

