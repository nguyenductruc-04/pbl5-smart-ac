  <rect x="100" y="670" width="240" height="60" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="220" y="694" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937">Điều hòa 01</text>
  <text x="220" y="712" text-anchor="middle" font-size="11" fill="#4B5563">Remote IR</text>

  <rect x="380" y="670" width="240" height="60" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="500" y="694" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937">Điều hòa 02</text>
  <text x="500" y="712" text-anchor="middle" font-size="11" fill="#4B5563">Remote IR</text>

  <rect x="660" y="670" width="240" height="60" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="780" y="694" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937">Điều hòa N</text>
