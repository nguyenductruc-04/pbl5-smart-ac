  <rect x="380" y="440" width="240" height="190" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="500" y="459" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065F46">ROOM NODE 02</text>
  <text x="500" y="475" text-anchor="middle" font-size="11" fill="#047857">ESP32-S3</text>
  <rect x="395" y="490" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.3"/>
  <text x="500" y="511" text-anchor="middle" font-size="11.5" fill="#1F2937">Nhiệt độ / Độ ẩm</text>
  <line x1="500" y1="524" x2="500" y2="536" stroke="#6B7280" stroke-width="1.3"/>
  <text x="508" y="533" font-size="9.5" fill="#6B7280">I2C</text>
  <rect x="395" y="536" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="1.3"/>
  <text x="500" y="557" text-anchor="middle" font-size="11.5" fill="#1F2937">Cảm biến hiện diện</text>
  <line x1="500" y1="570" x2="500" y2="582" stroke="#6B7280" stroke-width="1.3"/>
  <text x="508" y="579" font-size="9.5" fill="#6B7280">GPIO</text>
  <rect x="395" y="582" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#F97066" stroke-width="1.3"/>
  <text x="500" y="603" text-anchor="middle" font-size="11.5" fill="#1F2937">IR Driver</text>

  <!-- Node 3 -->
  <rect x="660" y="440" width="240" height="190" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="780" y="459" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065F46">ROOM NODE N</text>
