<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1120" height="760" viewBox="0 0 1120 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#374151" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="760" fill="#FFFFFF"/>

  <!-- ============ USER LAYER ============ -->
  <rect x="350" y="20" width="300" height="60" rx="10" fill="#EAF2FF" stroke="#378ADD" stroke-width="1.5"/>
  <text x="500" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">Người dùng / Quản trị</text>
  <text x="500" y="64" text-anchor="middle" font-size="12" fill="#3B5B7A">Mobile App · Web App · Dashboard</text>

  <line x1="500" y1="80" x2="500" y2="123" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="515" y="105" font-size="12" fill="#374151">HTTPS / WebSocket</text>

  <!-- ============ GATEWAY CONTAINER ============ -->
  <rect x="90" y="130" width="820" height="260" rx="12" fill="#F5F5F7" stroke="#6B7280" stroke-width="1.5"/>
  <text x="500" y="153" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">RASPBERRY PI 5 — GATEWAY</text>

  <!-- Row 1 -->
  <rect x="110" y="170" width="250" height="55" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.5"/>
  <text x="235" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937">API Server</text>
  <text x="235" y="209" text-anchor="middle" font-size="11.5" fill="#4B5563">FastAPI</text>

  <rect x="375" y="170" width="250" height="55" rx="8" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="1.5"/>
  <text x="500" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937">MQTT Broker</text>
  <text x="500" y="209" text-anchor="middle" font-size="11.5" fill="#4B5563">Mosquitto</text>

  <rect x="640" y="170" width="250" height="55" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="765" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937">Auth / RBAC</text>
  <text x="765" y="209" text-anchor="middle" font-size="11.5" fill="#4B5563">Phân quyền</text>

  <!-- Row 2 -->
  <rect x="110" y="240" width="250" height="55" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="235" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937">Rule Engine</text>
  <text x="235" y="279" text-anchor="middle" font-size="11.5" fill="#4B5563">Lịch / ngưỡng</text>

  <rect x="375" y="240" width="250" height="55" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="500" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937">Database</text>
  <text x="500" y="279" text-anchor="middle" font-size="11.5" fill="#4B5563">SQLite / SQL</text>

  <rect x="640" y="240" width="250" height="55" rx="8" fill="#FFFFFF" stroke="#EC4899" stroke-width="1.5"/>
  <text x="765" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2937">AI Service</text>
