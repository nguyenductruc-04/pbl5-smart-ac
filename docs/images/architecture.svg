  <rect x="115" y="582" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#F97066" stroke-width="1.3"/>
  <text x="220" y="603" text-anchor="middle" font-size="11.5" fill="#1F2937">IR Driver</text>

