  <line x1="780" y1="524" x2="780" y2="536" stroke="#6B7280" stroke-width="1.3"/>
  <text x="788" y="533" font-size="9.5" fill="#6B7280">I2C</text>
  <rect x="675" y="536" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="1.3"/>
  <text x="780" y="557" text-anchor="middle" font-size="11.5" fill="#1F2937">Cảm biến hiện diện</text>
  <line x1="780" y1="570" x2="780" y2="582" stroke="#6B7280" stroke-width="1.3"/>
