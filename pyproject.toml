[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["api", "control", "gateway", "netwatch", "push_wifi", "safety", "settings", "store"]

[tool.pytest.ini_options]
testpaths = ["gateway/tests"]
pythonpath = ["gateway"]
