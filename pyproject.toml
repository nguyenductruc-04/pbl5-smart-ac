[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "advisor", "api", "irproto", "ashrae", "comfort", "control", "gateway", "metrics", "netmode", "netwatch", "push_wifi", "reset_button",
                     "safety", "settings", "setup_label", "store", "votes"]

[tool.ruff.lint.per-file-ignores]
# Bao cao Markdown viet thang trong f-string: dong dai la noi dung, khong phai ma
"ml/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["gateway/tests"]
pythonpath = ["gateway"]
